<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ªGE تيم | Cloudflare Control</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
body{background:radial-gradient(circle at top,rgba(99,102,241,.12),transparent 30%),linear-gradient(180deg,#05060a,#0b0f14 55%,#05060a);color:#e5fbea;font-family:'Segoe UI',sans-serif}.card{background:#0a100c;border:1px solid #252938;border-radius:16px;padding:20px;box-shadow:0 10px 35px rgba(0,0,0,.22)}.btn{font-weight:700;font-size:13px;transition:.12s}.btn:active{transform:scale(.96)}.terminal{background:#07090d;border:1px solid #202531;border-radius:12px;height:340px;overflow:auto;white-space:pre-wrap;padding:14px;font:12px/1.5 'Courier New',monospace;color:#d1d5db}.pill{border:1px solid #303542;background:#111621;border-radius:999px;padding:5px 10px;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
</style></head>
<body class="min-h-screen"><div class="max-w-6xl mx-auto p-4">
<header class="flex items-center justify-between gap-3 mb-4"><div><div class="text-xl font-black"><span class="text-indigo-400">☁</span> CLOUD CONTROL</div><div class="text-xs text-gray-500 mt-1">Project: <span class="text-emerald-300 font-mono">{{ server_id[:8] }}</span></div></div><a href="{{ home_url }}" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-xs btn">← BACK</a></header>
<div class="grid lg:grid-cols-3 gap-4"><section class="card lg:col-span-2"><div class="flex items-center justify-between mb-4"><h2 class="font-bold text-indigo-300"><i class="fas fa-network-wired mr-2"></i> Tunnel</h2><span class="pill"><span id="statusDot" class="dot bg-red-500 mr-1"></span><span id="statusText">STOPPED</span></span></div>
<div class="grid md:grid-cols-2 gap-3"><div><label class="block text-xs text-gray-400 mb-1">Detected ports</label><select id="portSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm"><option value="">AUTO</option></select></div><div><label class="block text-xs text-gray-400 mb-1">Manual port</label><input id="portInput" type="number" min="1" max="65535" placeholder="e.g. 5000" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm"></div></div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-3"><button onclick="detectPorts()" class="bg-slate-700 hover:bg-slate-600 py-3 rounded-lg btn">↻ DETECT</button><button type="button" id="startBtn" onclick="return startCloud(event)" class="bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg btn">▶ START</button><button type="button" id="stopBtn" onclick="return stopCloud(event)" class="bg-red-600 hover:bg-red-500 py-3 rounded-lg btn">■ STOP</button><button type="button" onclick="return restartCloud(event)" class="bg-yellow-600 hover:bg-yellow-500 py-3 rounded-lg btn">↻ RESTART</button></div>
<div class="mt-4 grid md:grid-cols-2 gap-3"><div class="bg-slate-950/60 rounded-xl p-4 border border-slate-800"><div class="text-[11px] text-gray-500">PUBLIC URL</div><div id="publicUrl" class="mt-2 font-mono text-sm break-all text-cyan-300">—</div><a id="openUrl" href="#" target="_blank" rel="noopener noreferrer" class="hidden mt-3 inline-flex bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded-lg text-xs btn">🔗 OPEN URL</a></div><div class="bg-slate-950/60 rounded-xl p-4 border border-slate-800"><div class="text-[11px] text-gray-500">LOCAL TARGET</div><div id="target" class="mt-2 font-mono text-sm text-emerald-300">—</div><div class="text-[11px] text-gray-500 mt-3">SELECTED PORT</div><div id="selectedPort" class="font-mono text-sm text-yellow-300">—</div></div></div></section>
<section class="card"><h2 class="font-bold text-indigo-300 mb-4"><i class="fas fa-circle-info mr-2"></i> Status</h2><div class="space-y-3 text-sm"><div class="flex justify-between"><span class="text-gray-500">Project</span><span class="font-mono">{{ server_id }}</span></div><div class="flex justify-between"><span class="text-gray-500">Binary</span><span>cloudflared</span></div><div class="flex justify-between"><span class="text-gray-500">Protocol</span><span>http2</span></div><div class="flex justify-between"><span class="text-gray-500">Origin</span><span>127.0.0.1</span></div></div><button onclick="refreshAll()" class="w-full mt-5 bg-slate-700 hover:bg-slate-600 py-3 rounded-lg btn">⟳ REFRESH EVERYTHING</button><a href="{{ home_url }}" class="w-full mt-2 bg-fuchsia-700 hover:bg-fuchsia-600 py-3 rounded-lg btn inline-flex justify-center">☰ PROJECT PANEL</a></section></div>
<section class="card mt-4"><div class="flex items-center justify-between mb-3"><h2 class="font-bold text-emerald-300"><i class="fas fa-terminal mr-2"></i> Cloudflare Log</h2><div class="flex gap-2"><button onclick="copyCloudUrl()" class="bg-cyan-700 hover:bg-cyan-600 px-3 py-2 rounded-lg text-xs btn">📋 COPY URL</button><button onclick="loadLog()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs btn">↻ LOG</button></div></div><div id="log" class="terminal">Loading...</div><div class="mt-3 rounded-xl border border-cyan-900/60 bg-cyan-950/20 p-4"><div class="flex items-center justify-between gap-2"><div><div class="text-[11px] text-gray-500">AUTO EXTRACTED CLOUDFLARE URL</div><div id="extractedUrl" class="mt-2 break-all font-mono text-sm text-cyan-300">—</div></div><button onclick="copyCloudUrl()" class="shrink-0 bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded-lg text-xs btn">COPY</button></div></div></section></div>
<div id="toast" class="fixed bottom-4 right-4 z-50"></div>
<script>
const serverId={{ server_id|tojson }};
function toast(msg){const b=document.getElementById('toast');b.innerHTML='<div class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 shadow-2xl text-sm">'+msg+'</div>';setTimeout(()=>b.innerHTML='',3500)}
function selectedPort(){const m=document.getElementById('portInput').value.trim();return m||document.getElementById('portSelect').value||null}
function fillPorts(ports){const s=document.getElementById('portSelect'),old=s.value;s.innerHTML='<option value="">AUTO</option>';(ports||[]).forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent='PORT '+p;s.appendChild(o)});if(old&&[...s.options].some(o=>o.value===old))s.value=old}
function setState(d){const r=!!d.running;document.getElementById('statusText').textContent=r?'RUNNING':'STOPPED';document.getElementById('statusDot').className='dot mr-1 '+(r?'bg-emerald-400':'bg-red-500');document.getElementById('startBtn').disabled=r;document.getElementById('stopBtn').disabled=!r;document.getElementById('target').textContent=d.target||'—';document.getElementById('selectedPort').textContent=d.port||'AUTO';const u=d.url||'';document.getElementById('publicUrl').textContent=u||'—';const a=document.getElementById('openUrl');if(u){a.href=u;a.classList.remove('hidden')}else a.classList.add('hidden')}
async function detectPorts(show=true){try{const d=await (await fetch('/api/cloud/ports/'+serverId)).json();if(d.status!=='success')throw Error(d.msg);fillPorts(d.ports||[]);if(show)toast(d.ports?.length?'Detected: '+d.ports.join(', '):'No listening ports detected')}catch(e){if(show)toast(e.message||'Port detection failed')}}
async function refreshStatus(){try{const d=await (await fetch('/api/cloud/status/'+serverId)).json();if(d.status==='success'){fillPorts(d.ports||[]);setState(d)}}catch(e){}}
async function startCloud(event){if(event)event.preventDefault();const btn=document.getElementById('startBtn');btn.disabled=true;try{toast('Starting Cloudflare...');const res=await fetch('/api/cloud/start/'+serverId,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({port:selectedPort()})});const d=await res.json().catch(()=>({status:'error',msg:'Invalid server response'}));if(!res.ok||d.status!=='success')throw Error(d.msg||'Start failed');setState(d);toast(d.msg||'Started');loadLog();let n=0;const t=setInterval(()=>{refreshStatus();loadLog();if(++n>=20)clearInterval(t)},1000)}catch(e){toast(e.message||'Start failed');loadLog();refreshStatus()}finally{btn.disabled=false}}
async function stopCloud(event){if(event)event.preventDefault();try{const res=await fetch('/api/cloud/stop/'+serverId,{method:'POST'});const d=await res.json().catch(()=>({status:'error',msg:'Invalid server response'}));if(!res.ok||d.status!=='success')throw Error(d.msg||'Stop failed');setState(d);toast('Cloudflare stopped');loadLog()}catch(e){toast(e.message||'Stop failed');loadLog()}}
async function restartCloud(){await stopCloud();setTimeout(startCloud,500)}
let lastCloudUrl='';
async function loadLog(){try{const d=await (await fetch('/api/cloud/logs/'+serverId)).json();document.getElementById('log').textContent=d.log||'[INFO] No Cloudflare logs yet...';const e=document.getElementById('log');e.scrollTop=e.scrollHeight;const u=d.url||'';if(u){lastCloudUrl=u;document.getElementById('extractedUrl').textContent=u;const a=document.getElementById('openUrl');if(a){a.href=u;a.classList.remove('hidden')}}else if(!lastCloudUrl){document.getElementById('extractedUrl').textContent='—'}}catch(e){document.getElementById('log').textContent='Log unavailable'}}
async function copyCloudUrl(){const u=lastCloudUrl||document.getElementById('publicUrl').textContent.trim();if(!u||u==='—'){toast('لا يوجد رابط Cloudflare حتى الآن');return}try{await navigator.clipboard.writeText(u);toast('تم نسخ رابط Cloudflare')}catch(e){const ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('تم نسخ رابط Cloudflare')}}
function refreshAll(){detectPorts(false);refreshStatus();loadLog()}refreshAll();setInterval(refreshStatus,4000);setInterval(loadLog,5000);
</script></body></html>
